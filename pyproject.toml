[project]
name = "detente"
version = "0.1.0"
description = "Traffic control for coding agents. Catches the moment one agent's change breaks code another agent is writing, before anyone pushes."
readme = "cli/README.md"  # the PyPI page: the CLI guide
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["coding-agents", "claude-code", "codex", "git", "switch", "collaboration", "ast"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
    "Topic :: Software Development :: Quality Assurance",
]
# Only what the laptop side needs. The tower's libraries are in the server group below.
dependencies = [
    "rich>=13",
    "typer>=0.15",
]

[project.scripts]
detente = "detente:main"

[project.urls]
Homepage = "https://github.com/laypatel13/detente"
Issues = "https://github.com/laypatel13/detente/issues"

[dependency-groups]
server = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false
default-groups = ["dev", "server"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Three folders go into the package: cli/ becomes `detente` (the commands), pilot/ (the gates and the
# watcher) and the one tower file the watcher needs, backend/contracts.py, which reads the code.
[tool.hatch.build.targets.wheel]
only-include = ["cli", "pilot", "backend/__init__.py", "backend/contracts.py"]
exclude = ["cli/tests", "cli/images", "cli/README.md", "__pycache__"]
sources = { "cli" = "detente" }

[tool.hatch.build.targets.wheel.force-include]
"frontend/lib/art/roger.json" = "detente/art/roger.json"
"frontend/app/showcase/_story/recordings/a.json" = "detente/recordings/a.json"
"frontend/app/showcase/_story/recordings/b.json" = "detente/recordings/b.json"

[tool.hatch.build.targets.sdist]
only-include = [
    "cli",
    "pilot",
    "backend/__init__.py",
    "backend/contracts.py",
    "frontend/lib/art/roger.json",
    "frontend/app/showcase/_story/recordings",
    "LICENSE",
]
exclude = ["cli/images", "__pycache__"]

[tool.pytest.ini_options]
testpaths = ["tests", "cli/tests"]
pythonpath = ["."]

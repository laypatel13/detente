# The judges' path on a clean machine, on every push: the offline tests and the 32 benchmark scenarios.
# No Docker, no API keys, the same commands the README gives.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: make test
      - run: make bench
